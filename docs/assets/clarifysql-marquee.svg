<svg width="100%" height="96" viewBox="0 0 920 96" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .ticker-text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 0.08em;
      }
      .tag-text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        font-size: 10px;
        font-weight: 800;
        letter-spacing: 0.14em;
      }
      @keyframes marqueeLeft {
        0% { transform: translateX(0); }
        100% { transform: translateX(-1600px); }
      }
      .track {
        animation: marqueeLeft 28s linear infinite;
        will-change: transform;
      }
    </style>
  </defs>

  <!-- Cream Parchment Ground -->
  <rect width="920" height="96" fill="#EFE9DD" stroke="#141C2B" stroke-opacity="0.2" stroke-width="1.2" />

  <!-- Top hairline & Category header -->
  <rect x="0" y="0" width="920" height="28" fill="#E5DED0" stroke="#141C2B" stroke-opacity="0.12" stroke-width="1" />
  <circle cx="24" cy="14" r="4" fill="#2C4A8F" />
  <text x="36" y="18" class="tag-text" fill="#141C2B">
    CONTINUOUS PIPELINE GUARANTEE <tspan fill="#767E8C">//</tspan> ZERO UNVALIDATED QUERIES <tspan fill="#767E8C">//</tspan> READ-ONLY ENFORCED
  </text>

  <!-- Running Marquee Track -->
  <g transform="translate(0, 40)">
    <g class="track">
      <!-- Set 1 (Total width = 1600px) -->
      <g transform="translate(0, 0)">
        <text x="20" y="24" class="ticker-text" fill="#141C2B">NATURAL LANGUAGE <tspan fill="#2C4A8F">➔</tspan> STRUCTURED INTENT</text>
        <text x="370" y="24" class="ticker-text" fill="#2C4A8F">◆</text>
        <text x="400" y="24" class="ticker-text" fill="#141C2B">SCHEMA INTROSPECTION <tspan fill="#767E8C">VIA</tspan> SQLALCHEMY</text>
        <text x="750" y="24" class="ticker-text" fill="#2C4A8F">◆</text>
        <text x="780" y="24" class="ticker-text" fill="#141C2B">AMBIGUITY DETECTION <tspan fill="#767E8C">BEFORE</tspan> EXECUTION</text>
        <text x="1170" y="24" class="ticker-text" fill="#2C4A8F">◆</text>
        <text x="1200" y="24" class="ticker-text" fill="#141C2B">AST VALIDATOR <tspan fill="#767E8C">VIA</tspan> SQLGLOT</text>
        <text x="1460" y="24" class="ticker-text" fill="#2C4A8F">◆</text>
        <text x="1490" y="24" class="ticker-text" fill="#141C2B">TIMEOUT 30s + LIMIT 1000</text>
        <text x="1760" y="24" class="ticker-text" fill="#2C4A8F">◆</text>
      </g>

      <!-- Set 2 (Identical duplicate offset by 1600px) -->
      <g transform="translate(1600, 0)">
        <text x="20" y="24" class="ticker-text" fill="#141C2B">NATURAL LANGUAGE <tspan fill="#2C4A8F">➔</tspan> STRUCTURED INTENT</text>
        <text x="370" y="24" class="ticker-text" fill="#2C4A8F">◆</text>
        <text x="400" y="24" class="ticker-text" fill="#141C2B">SCHEMA INTROSPECTION <tspan fill="#767E8C">VIA</tspan> SQLALCHEMY</text>
        <text x="750" y="24" class="ticker-text" fill="#2C4A8F">◆</text>
        <text x="780" y="24" class="ticker-text" fill="#141C2B">AMBIGUITY DETECTION <tspan fill="#767E8C">BEFORE</tspan> EXECUTION</text>
        <text x="1170" y="24" class="ticker-text" fill="#2C4A8F">◆</text>
        <text x="1200" y="24" class="ticker-text" fill="#141C2B">AST VALIDATOR <tspan fill="#767E8C">VIA</tspan> SQLGLOT</text>
        <text x="1460" y="24" class="ticker-text" fill="#2C4A8F">◆</text>
        <text x="1490" y="24" class="ticker-text" fill="#141C2B">TIMEOUT 30s + LIMIT 1000</text>
        <text x="1760" y="24" class="ticker-text" fill="#2C4A8F">◆</text>
      </g>
    </g>
  </g>
</svg>
